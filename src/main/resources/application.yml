spring:
  application:
    name: katar
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${KATAR_DB_URL:jdbc:postgresql://localhost:5492/katar}
    username: ${KATAR_DB_USER:katar}
    password: ${KATAR_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${KATAR_DB_POOL:20}

katar:
  # Secrets come from the environment in production. The dev values below are
  # deliberately obvious so they can never be mistaken for real ones.
  pass-secret: ${KATAR_PASS_SECRET:dev-only-pass-secret-change-me}
  # Ed25519 private key (PKCS#8, base64) that signs tickets. Empty: a fresh key
  # is made at startup, fine for development, useless for verifying tickets later.
  ticket-private-key: ${KATAR_TICKET_PRIVATE_KEY:}
  person-pepper: ${KATAR_PERSON_PEPPER:dev-only-pepper-change-me}
  payment-secret: ${KATAR_PAYMENT_SECRET:dev-only-payment-secret-change-me}
  hold-ttl: 10m
  pass-ttl: 15m
  claim-window: 2m
  max-seats-per-person: 4
  admitter-interval: 1s
  sweeper-interval: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
  tomcat:
    # A sale opening is thousands of connections in the same second. The
    # default backlog of 100 refuses most of them at the TCP level before
    # katar sees them (measured: 576 of 800 refused in the rush test).
    accept-count: 1000
