name: CI

# Every push and pull request runs the full test suite against a real
# PostgreSQL 18 (embedded, so no service container is needed). A push to main
# that passes then builds the amd64 + arm64 image the Oracle server pulls.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: ./mvnw -B verify
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: Nafiz001/portfolio-deploy/.github/workflows/image.yml@main
    with:
      image: katar
